<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觀景山飯堂員工價目計算機</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            text-decoration: underline;
            margin-bottom: 30px;
        }

        .category {
            margin-bottom: 25px;
        }

        .category-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .item-name {
            flex: 1;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 10px;
            user-select: none;
        }

        .count {
            font-size: 18px;
            min-width: 20px;
            text-align: center;
        }

        .calculate-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .calculate-btn {
            background: #fff;
            border: 3px solid #000;
            padding: 8px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 3px solid #000;
            padding: 20px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 80%;
            max-width: 300px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .close-modal {
            margin-top: 15px;
            padding: 5px 15px;
            border: 2px solid #000;
            background: #fff;
            cursor: pointer;
        }

        .item.highlight {
            background-color: #53ff03;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>觀景山飯堂員工價目計算機</h1>

        <div class="category">
            <div class="category-title">套餐 (必須選擇飲品)</div>
            <div class="item">
                <span class="item-name">西早套餐 ($10)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('west-breakfast', 1)">+</button>
                    <span class="count" id="west-breakfast">0</span>
                    <button class="btn" onclick="updateCount('west-breakfast', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">醒神套餐 ($12)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('wake-up-set', 1)">+</button>
                    <span class="count" id="wake-up-set">0</span>
                    <button class="btn" onclick="updateCount('wake-up-set', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">雙餸湯麵套餐 ($10)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('double-topping-noodle', 1)">+</button>
                    <span class="count" id="double-topping-noodle">0</span>
                    <button class="btn" onclick="updateCount('double-topping-noodle', -1)">−</button>
                </div>
            </div>
        </div>

        <div class="category">
            <div class="category-title">單品</div>
            <div class="item">
                <span class="item-name">五香肉丁湯麵 ($10)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('spiced-pork-noodle', 1)">+</button>
                    <span class="count" id="spiced-pork-noodle">0</span>
                    <button class="btn" onclick="updateCount('spiced-pork-noodle', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">糯米雞 ($15)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('sticky-rice-chicken', 1)">+</button>
                    <span class="count" id="sticky-rice-chicken">0</span>
                    <button class="btn" onclick="updateCount('sticky-rice-chicken', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">各款多士 ($4)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('toasts', 1)">+</button>
                    <span class="count" id="toasts">0</span>
                    <button class="btn" onclick="updateCount('toasts', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">單拼三文治 ($6)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('single-sandwich', 1)">+</button>
                    <span class="count" id="single-sandwich">0</span>
                    <button class="btn" onclick="updateCount('single-sandwich', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">雙拼三文治 ($7.5)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('double-sandwich', 1)">+</button>
                    <span class="count" id="double-sandwich">0</span>
                    <button class="btn" onclick="updateCount('double-sandwich', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">午餐/晚餐 ($12)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('lunch-dinner', 1)">+</button>
                    <span class="count" id="lunch-dinner">0</span>
                    <button class="btn" onclick="updateCount('lunch-dinner', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">炒粉麵飯 ($21)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('fried-rice-noodle', 1)">+</button>
                    <span class="count" id="fried-rice-noodle">0</span>
                    <button class="btn" onclick="updateCount('fried-rice-noodle', -1)">−</button>
                </div>
            </div>
        </div>

        <div class="category">
            <div class="category-title">早餐加配</div>
            <div class="item">
                <span class="item-name">麵底 ($5)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('noodle-base', 1)">+</button>
                    <span class="count" id="noodle-base">0</span>
                    <button class="btn" onclick="updateCount('noodle-base', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">豬柳漢堡 ($4)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('pork-burger', 1)">+</button>
                    <span class="count" id="pork-burger">0</span>
                    <button class="btn" onclick="updateCount('pork-burger', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">麵包/餐肉/火腿/香腸/雞蛋 ($2)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('addons', 1)">+</button>
                    <span class="count" id="addons">0</span>
                    <button class="btn" onclick="updateCount('addons', -1)">−</button>
                </div>
            </div>
        </div>

        <div class="category">
            <div class="category-title">飲品</div>
            <div class="item">
                <span class="item-name">熱飲 (基本$3，套餐$0)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('hot-drink', 1)">+</button>
                    <span class="count" id="hot-drink">0</span>
                    <button class="btn" onclick="updateCount('hot-drink', -1)">−</button>
                </div>
            </div>
            <div class="item">
                <span class="item-name">凍飲 (基本$4，套餐$1)</span>
                <div class="controls">
                    <button class="btn" onclick="updateCount('cold-drink', 1)">+</button>
                    <span class="count" id="cold-drink">0</span>
                    <button class="btn" onclick="updateCount('cold-drink', -1)">−</button>
                </div>
            </div>
        </div>

        <div class="calculate-btn-container">
            <button class="calculate-btn" onclick="calculateTotal()">計算金額</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="result-modal" id="resultModal">
        <h2>總金額</h2>
        <p id="totalDisplay" style="font-size: 24px; font-weight: bold; margin: 20px 0;"></p>
        <button class="close-modal" onclick="closeModal()">關閉</button>
    </div>

    <script>
        const prices = {
            'west-breakfast': 10,
            'wake-up-set': 12,
            'double-topping-noodle': 10,
            'spiced-pork-noodle': 10,
            'sticky-rice-chicken': 15,
            'toasts': 4,
            'single-sandwich': 6,
            'double-sandwich': 7.5,
            'lunch-dinner': 12,
            'fried-rice-noodle': 21,
            'noodle-base': 5,
            'pork-burger': 4,
            'addons': 2
        };

        const setMealIds = ['west-breakfast', 'wake-up-set', 'double-topping-noodle'];

        function updateCount(id, delta) {
            const countSpan = document.getElementById(id);
            let count = parseInt(countSpan.innerText);
            count = Math.max(0, count + delta);
            countSpan.innerText = count;

            // 處理 Highlight
            const itemRow = countSpan.closest('.item');
            if (count > 0) {
                itemRow.classList.add('highlight');
            } else {
                itemRow.classList.remove('highlight');
            }
        }

        function calculateTotal() {
            let total = 0;
            let totalSetMeals = 0;
            
            // 計算套餐與非飲品單項
            for (const id in prices) {
                const count = parseInt(document.getElementById(id).innerText);
                total += count * prices[id];
                if (setMealIds.includes(id)) {
                    totalSetMeals += count;
                }
            }

            const hotDrinkCount = parseInt(document.getElementById('hot-drink').innerText);
            const coldDrinkCount = parseInt(document.getElementById('cold-drink').innerText);
            const totalDrinks = hotDrinkCount + coldDrinkCount;

            // 驗證：如果有套餐，飲品數量必須 >= 套餐數量
            if (totalSetMeals > 0 && totalDrinks < totalSetMeals) {
                alert(`請選擇足夠數量的飲品！\n當前套餐總數：${totalSetMeals}\n已選飲品總數：${totalDrinks}\n(飲品數量必須等於或多於套餐數量)`);
                return;
            }

            // 計算飲品價錢
            let remainingSetDrinks = totalSetMeals;
            
            // 優先處理凍飲 (套餐配凍飲 +$1)
            let currentColdDrinks = coldDrinkCount;
            let coldDrinksAsSet = Math.min(currentColdDrinks, remainingSetDrinks);
            total += coldDrinksAsSet * 1;
            total += (currentColdDrinks - coldDrinksAsSet) * 4;
            remainingSetDrinks -= coldDrinksAsSet;

            // 處理熱飲 (套餐配熱飲 +$0)
            let currentHotDrinks = hotDrinkCount;
            let hotDrinksAsSet = Math.min(currentHotDrinks, remainingSetDrinks);
            total += hotDrinksAsSet * 0;
            total += (currentHotDrinks - hotDrinksAsSet) * 3;

            const totalDisplay = document.getElementById('totalDisplay');
            totalDisplay.innerText = `$${total}`;

            document.getElementById('overlay').style.display = 'block';
            document.getElementById('resultModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('resultModal').style.display = 'none';
        }

        // 點擊遮罩層也可關閉彈窗
        document.getElementById('overlay').onclick = closeModal;
    </script>
</body>
</html>
